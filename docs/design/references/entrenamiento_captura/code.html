<!-- Section Title -->
<div class="w-full text-center pt-space-sm pb-space-xs"><h2 class="text-[24px] font-bold tracking-tight font-headline-md" style="color: #172C20;">Entrenamiento</h2></div><div class="relative flex items-center justify-center py-space-sm pt-space-md">
<!-- Atmospheric Ambient Backlight -->
<div class="absolute w-52 h-52 rounded-full blur-2xl pointer-events-none animate-pulse" style="background-color: rgba(22, 133, 75, 0.12);"></div>
<!-- Dual-track Circular Gauge (SVG) -->
<div class="relative w-56 h-56 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 220 220">
<!-- Background Track -->
<circle cx="110" cy="110" fill="none" opacity="1" r="92" stroke="#E4F3E9" stroke-width="7"></circle>
<!-- Dynamic Neon Arc Track -->
<circle class="transition-all duration-300 drop-shadow-[0_2px_8px_rgba(22,133,75,0.25)]" cx="110" cy="110" fill="none" id="gauge-progress" r="92" stroke="#16854B" stroke-dasharray="578" stroke-dashoffset="190" stroke-linecap="round" stroke-width="7"></circle>
</svg>
<!-- Center Telemetry Readout -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<!-- Running Modality Glyph -->
<div class="w-10 h-10 rounded-full flex items-center justify-center mb-space-xs transition-transform duration-200" id="activity-icon-container" style="color: #16854B;">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &quot;FILL&quot; 1; color: #16854B;">directions_run</span>
</div>
<!-- Big Bold Digital Timer Metric -->
<div class="flex items-baseline justify-center tracking-tight" style="color: #172C20;">
<span class="font-display-stat text-display-stat font-bold tabular-nums" id="countdown-val" style="color: #172C20;">10</span>
<span class="font-headline-sm text-headline-sm ml-1 font-semibold" style="color: #172C20;">s</span>
</div>
<!-- Telemetry Status Pulse Dot -->
<div class="mt-space-xs flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(22,133,75,0.6)] transition-all" id="status-pulse-dot" style="background-color: #16854B;"></div>
</div>
</div>
</div>
</div>
<!-- Bottom Interaction Panel -->
<div class="w-full flex flex-col pb-space-xs gap-space-md mt-space-lg">
<!-- Activity Mode Selector Dropdown Card -->
<div class="relative w-full">
<button class="w-full h-14 bg-white active:scale-[0.99] rounded-xl px-margin flex items-center justify-between transition-all duration-150 border border-[#E2ECE5] shadow-sm hover:border-[#16854B]/40" id="modal-selector-btn" style="background-color: #FFFFFF; color: #172C20;" type="button">
<div class="flex items-center gap-space-sm min-w-0">
<span class="material-symbols-outlined text-[22px]" id="current-activity-icon" style="color: #16854B;">directions_walk</span>
<span class="font-label-lg text-label-lg font-medium truncate" id="current-activity-label" style="color: #172C20;">Caminando</span>
</div>
<span class="material-symbols-outlined text-[22px] transition-transform duration-200" id="chevron-indicator" style="color: #506557;">expand_more</span>
</button>
<!-- Modal Options Popup List -->
<div class="hidden absolute bottom-16 left-0 w-full bg-white rounded-xl p-space-xs shadow-lg z-20 flex-col gap-1 border border-[#E2ECE5]" id="activity-menu" style="background-color: #FFFFFF;">
<button class="option-item w-full flex items-center gap-space-sm px-space-md py-space-sm rounded-lg hover:bg-[#E4F3E9] text-left transition-colors" data-icon="directions_walk" data-label="Caminando" type="button">
<span class="material-symbols-outlined text-[20px]" style="color: #16854B;">directions_walk</span>
<span class="font-label-md text-label-md font-medium" style="color: #172C20;">Caminando</span>
</button>
<button class="option-item w-full flex items-center gap-space-sm px-space-md py-space-sm rounded-lg hover:bg-[#E4F3E9] text-left transition-colors" data-icon="directions_run" data-label="Corriendo" type="button">
<span class="material-symbols-outlined text-[20px]" style="color: #16854B;">directions_run</span>
<span class="font-label-md text-label-md font-medium" style="color: #172C20;">Corriendo</span>
</button>
<button class="option-item w-full flex items-center gap-space-sm px-space-md py-space-sm rounded-lg hover:bg-[#E4F3E9] text-left transition-colors" data-icon="directions_bike" data-label="Bicicleta" type="button">
<span class="material-symbols-outlined text-[20px]" style="color: #16854B;">directions_bike</span>
<span class="font-label-md text-label-md font-medium" style="color: #172C20;">Bicicleta</span>
</button>
<button class="option-item w-full flex items-center gap-space-sm px-space-md py-space-sm rounded-lg hover:bg-[#E4F3E9] text-left transition-colors" data-icon="airline_seat_recline_normal" data-label="Reposo" type="button">
<span class="material-symbols-outlined text-[20px]" style="color: #16854B;">airline_seat_recline_normal</span>
<span class="font-label-md text-label-md font-medium" style="color: #172C20;">Reposo</span>
</button>
</div>
</div>
<!-- Primary Action Execution Button -->
<button class="w-full h-14 active:scale-[0.98] rounded-xl flex items-center justify-center font-label-lg text-label-lg font-bold shadow-[0_4px_16px_rgba(22,133,75,0.25)] transition-all duration-150" id="main-action-btn" style="background-color: #16854B; color: #FFFFFF;" type="button">
<span class="" id="btn-text">Iniciar</span>
</button>
</div>
</div>
<script>
  (function () {
    const selectorBtn = document.getElementById('modal-selector-btn');
    const menu = document.getElementById('activity-menu');
    const chevron = document.getElementById('chevron-indicator');
    const label = document.getElementById('current-activity-label');
    const actIcon = document.getElementById('current-activity-icon');
    const options = document.querySelectorAll('.option-item');
    const actionBtn = document.getElementById('main-action-btn');
    const btnText = document.getElementById('btn-text');
    const countdownEl = document.getElementById('countdown-val');
    const gaugeProgress = document.getElementById('gauge-progress');
    const statusDot = document.getElementById('status-pulse-dot');

    let isTracking = false;
    let timerId = null;
    let secondsLeft = 10;
    const totalSeconds = 10;
    const maxOffset = 578;

    selectorBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = menu.classList.contains('hidden');
      if (isHidden) {
        menu.classList.remove('hidden');
        menu.classList.add('flex');
        chevron.classList.add('rotate-180');
      } else {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
        chevron.classList.remove('rotate-180');
      }
    });

    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && !selectorBtn.contains(e.target)) {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
        chevron.classList.remove('rotate-180');
      }
    });

    options.forEach((opt) => {
      opt.addEventListener('click', () => {
        const selectedLabel = opt.getAttribute('data-label');
        const selectedIcon = opt.getAttribute('data-icon');
        label.textContent = selectedLabel;
        actIcon.textContent = selectedIcon;
        menu.classList.add('hidden');
        menu.classList.remove('flex');
        chevron.classList.remove('rotate-180');
      });
    });

    actionBtn.addEventListener('click', () => {
      if (!isTracking) {
        // Start capture session
        isTracking = true;
        secondsLeft = 10;
        countdownEl.textContent = secondsLeft;
        btnText.textContent = 'Detener';
        actionBtn.style.backgroundColor = '#ba1a1a';
        actionBtn.style.color = '#FFFFFF';
        actionBtn.style.boxShadow = '0 4px 16px rgba(186, 26, 26, 0.25)';
        statusDot.classList.add('animate-ping');

        gaugeProgress.style.strokeDashoffset = '0';

        timerId = setInterval(() => {
          secondsLeft--;
          if (secondsLeft <= 0) {
            resetTracking();
          } else {
            countdownEl.textContent = secondsLeft;
            const progress = (totalSeconds - secondsLeft) / totalSeconds;
            gaugeProgress.style.strokeDashoffset = String(maxOffset * progress);
          }
        }, 1000);
      } else {
        resetTracking();
      }
    });

    function resetTracking() {
      clearInterval(timerId);
      isTracking = false;
      secondsLeft = 10;
      countdownEl.textContent = '10';
      gaugeProgress.style.strokeDashoffset = '190';
      btnText.textContent = 'Iniciar';
      actionBtn.style.backgroundColor = '#16854B';
      actionBtn.style.color = '#FFFFFF';
      actionBtn.style.boxShadow = '0 4px 16px rgba(22, 133, 75, 0.25)';
      statusDot.classList.remove('animate-ping');
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe backdrop-blur-xl shadow-[0_-2px_10px_rgba(0,0,0,0.04)]" data-active-classes="font-label-md" style="background-color: rgba(245, 248, 245, 0.95); border-top: 1px solid #E2ECE5;"><div class="grid grid-cols-4 items-center h-20 px-space-xs"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 transition-colors font-label-md font-semibold" data-path="captura" href="#" style="color: #16854B;"><span class="material-symbols-outlined text-[24px]">sensors</span><span class="font-label-sm text-label-sm">Captura</span></a><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 transition-colors" data-path="entrenamiento" href="#" style="color: #506557;"><span class="material-symbols-outlined text-[24px]">model_training</span><span class="font-label-sm text-label-sm">Entrenamiento</span></a><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 transition-colors" data-path="prediccion" href="#" style="color: #506557;"><span class="material-symbols-outlined text-2xl mb-0.5">psychology</span><span class="font-label-sm text-label-sm">Predicción</span></a><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 transition-colors" data-path="pendientes" href="#" style="color: #506557;"><div class="relative"><span class="material-symbols-outlined text-2xl mb-0.5">pending_actions</span><span class="absolute top-0 right-0 w-2 h-2 bg-[#2DBE71] rounded-full"></span></div><span class="font-label-sm text-label-sm">Pendientes</span></a></div></nav>
