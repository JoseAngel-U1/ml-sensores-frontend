full flex flex-col pb-space-xs gap-space-md mt-space-xl"><button class="w-full h-14 bg-[#16854B] hover:bg-[#126e3e] active:scale-[0.98] rounded-xl flex items-center justify-center gap-2 font-label-lg text-label-lg font-bold text-white shadow-[0_4px_16px_rgba(22,133,75,0.25)] transition-all duration-150" id="sendPredictionBtn" type="button"><span class="material-symbols-outlined text-[22px] transition-transform text-white" id="sendIcon" style="font-variation-settings: 'FILL' 1;">send</span><span class="font-label-lg text-label-lg tracking-wide uppercase font-bold text-white" id="sendLabel">Enviar</span></button></div></div></div>
<script>
  (function () {
    const sendBtn = document.getElementById('sendPredictionBtn');
    const sendIcon = document.getElementById('sendIcon');
    const sendLabel = document.getElementById('sendLabel');
    const predictionArc = document.getElementById('predictionArc');

    if (!sendBtn) return;

    // Feedback micro-interaction on trigger
    let isProcessing = false;
    sendBtn.addEventListener('click', () => {
      if (isProcessing) return;
      isProcessing = true;

      // Pulse circular arc
      predictionArc.style.strokeDashoffset = '10';
      sendBtn.classList.add('opacity-90');
      sendIcon.textContent = 'hourglass_empty';
      sendIcon.classList.add('animate-spin');
      sendLabel.textContent = 'Calculando...';

      setTimeout(() => {
        predictionArc.style.strokeDashoffset = '65';
        sendIcon.classList.remove('animate-spin');
        sendIcon.textContent = 'check_circle';
        sendLabel.textContent = 'Procesado';

        setTimeout(() => {
          sendIcon.textContent = 'send';
          sendLabel.textContent = 'Enviar';
          sendBtn.classList.remove('opacity-90');
          isProcessing = false;
        }, 1200);
      }, 900);
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#F5F8F5]/95 backdrop-blur-xl border-t border-[#E4F3E9] shadow-[0_-2px_10px_rgba(0,0,0,0.03)]" data-active-classes="text-[#16854B] font-label-md"><div class="grid grid-cols-4 items-center h-20 px-space-xs"><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 text-[#506557] hover:text-[#16854B] transition-colors" data-path="captura" href="#"><span class="material-symbols-outlined text-[24px]">sensors</span><span class="font-label-sm text-label-sm">Captura</span></a><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 text-[#506557] hover:text-[#16854B] transition-colors" data-path="entrenamiento" href="#"><span class="material-symbols-outlined text-[24px]">model_training</span><span class="font-label-sm text-label-sm">Entrenamiento</span></a><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 transition-colors text-[#16854B]" data-path="prediccion" href="#"><span class="material-symbols-outlined text-2xl mb-0.5">psychology</span><span class="font-label-sm text-label-sm font-semibold">Predicción</span></a><a class="flex flex-col items-center justify-center gap-1 min-h-[44px] py-1 text-[#506557] hover:text-[#16854B] transition-colors" data-path="pendientes" href="#"><div class="relative"><span class="material-symbols-outlined text-2xl mb-0.5">pending_actions</span><span class="absolute top-0 right-0 w-2 h-2 bg-[#2DBE71] rounded-full"></span></div><span class="font-label-sm text-label-sm">Pendientes</span></a></div></nav>
